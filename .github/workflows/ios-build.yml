name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS App (Debug - No Signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
        continue-on-error: true

      - name: List build artifacts
        if: always()
        run: |
          echo "Build completed. Checking outputs:"
          ls -la ios/App/build/ || echo "Build directory not found"
          find ios/App -name "*.app" || echo "No .app files found"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/App/build/Logs/
            ios/App/build/**/*.log
          retention-days: 7
          if-no-files-found: warn
